# golangci-lint configuration
# See: https://golangci-lint.run/usage/configuration/

run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    # Don't check error returns for common functions where errors are often ignored
    exclude-functions:
      - (io.Closer).Close
      - (net/http.ResponseWriter).Write
      - fmt.Fprintf
      - fmt.Printf
      - fmt.Print
      - fmt.Println
    check-type-assertions: false
    check-blank: false

issues:
  # Exclude all linter issues in test files
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosimple
        - govet
        - ineffassign
        - staticcheck

